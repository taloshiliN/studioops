services:
  postgres:
    image: postgres:16
    container_name: studioops-postgres
    environment:
      POSTGRES_DB: studioops
      POSTGRES_USER: studioops
      POSTGRES_PASSWORD: studioops
    ports:
      - "5432:5432"
    volumes:
      - "studioops-data:/var/lib/postgresql/data"
volumes:
  studioops-data: