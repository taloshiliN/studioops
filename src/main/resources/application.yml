spring:
  application:
    name: studioops

  datasource:
    url: jdbc:postgresql://localhost:5432/studioops
    username: studioops
    password: studioops

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
