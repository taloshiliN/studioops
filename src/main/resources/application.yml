spring:
  application:
    name: studioops

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/studioops}
    username: ${DB_USERNAME:studioops}
    password: ${PASSWORD:studioops}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info